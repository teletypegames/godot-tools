steps:
  - name: version
    image: alpine
    commands:
      - apk add --no-cache git make jq
      - make ci-version

  - name: build
    image: git.teletypegames.org/internal/godot-builder:4.6
    commands:
      - make ci-export
      - make ci-binaries

  - name: artifact
    image: alpine
    environment:
      UPDATE_SERVER: https://teletypegames.org
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - apk add --no-cache make curl
      - make ci-upload

  - name: update
    image: alpine
    environment:
      UPDATE_SERVER: https://teletypegames.org
      UPDATE_SECRET:
        from_secret: update_secret_key
    commands:
      - apk add --no-cache make curl
      - make ci-update
